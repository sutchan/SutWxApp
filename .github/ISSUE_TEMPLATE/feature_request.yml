name: 功能建议
description: 为苏铁微信小程序提出新功能或改进建议
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚需求与方案，便于评估与排期。
  - type: textarea
    id: problem
    attributes:
      label: 你的需求 / 问题
      description: 当前存在什么不便，或你想解决什么问题？
      placeholder: 例如：目前无法按销量排序商品列表，找爆款很麻烦。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望如何解决这个问题？可以是交互、页面或能力层面的描述。
      placeholder: 在分类页顶部增加「综合 / 销量 / 价格」排序选项。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式？
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、参考链接、相关 Issue 等。
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已检索是否已有相同或相关建议
