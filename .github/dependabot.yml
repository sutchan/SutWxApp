# 文件路径: .github/dependabot.yml
# 版本号: 1.1.0
# 更新日期: 2026-11-14
# 描述: Dependabot 依赖更新配置：npm 开发依赖与 GitHub Actions 每周检查一次，
#       次要/补丁更新聚合为单个 PR，减少评审噪音；主版本更新仍单独提 PR。

version: 2
updates:
  # 小程序工程依赖（ESLint / Jest 等开发依赖）
  - package-ecosystem: npm
    directory: /SutWxApp
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"

  # 工作流中引用的 Actions 版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
    groups:
      actions-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
