# 文件路径: .github/workflows/release.yml
# 版本号: 1.3.0
# 更新日期: 2026-11-14
# 描述: 持续交付流水线：推送 v*.*.* Tag 或由 auto-release.yml 触发时，校验版本一致性，
#       构建并打包三份交付物，以 CHANGELOG 小节创建 GitHub Release

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 Tag 名称（如 v3.5.16），用于补发 Release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 三种触发（push tag / 手动补发 / auto-release 派发）统一检出目标 Tag 的代码，
      # 避免 workflow_dispatch 默认检出默认分支导致产物与 Tag 不一致。
      - name: 检出目标 Tag 代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 解析目标 Tag
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: 校验 Tag 与项目版本号一致
        env:
          RELEASE_TAG: ${{ env.TAG }}
        run: node SutWxApp/scripts/check-version.js

      # OPS-006：插件三处版本源（常量 / 插件头 / readme）必须一致
      - name: 校验插件版本一致性
        run: node SutWxApp/scripts/check-plugin-version.js

      - name: 从 CHANGELOG 提取发布说明
        run: node scripts/changelog-section.js "$TAG" > release-notes.md

      - name: 构建静态站点产物
        run: node build.js

      - name: 打包交付物
        run: |
          set -euo pipefail
          mkdir -p release-assets
          zip -qr "release-assets/sutwxapp-site-${TAG}.zip" dist

          # 交付物不得包含上传私钥、环境变量文件、测试与构建中间产物
          zip -qr "release-assets/sutwxapp-miniprogram-${TAG}.zip" SutWxApp \
            -x "SutWxApp/node_modules/*" \
               "SutWxApp/coverage/*" \
               "SutWxApp/.tmp/*" \
               "SutWxApp/private.key" \
               "SutWxApp/private.*.key" \
               "SutWxApp/*.private.key" \
               "SutWxApp/.env" \
               "SutWxApp/.env.*" \
               "SutWxApp/preview.jpg"

          # OPS-006：插件包由 package-plugin.js 生成（排除 tests/、含 readme.txt）
          node SutWxApp/scripts/package-plugin.js
          PLUGIN_ZIP=$(ls dist/sutwx-app-api-v*.zip | head -n 1)
          cp "$PLUGIN_ZIP" "release-assets/"

          # 校验插件包内容完整；缺失时才失败（原实现误用 ; 导致每次发布必失败）
          unzip -l "$PLUGIN_ZIP" | grep -q "sutwx-app-api/readme.txt" \
            || { echo "::error::插件包缺少 readme.txt"; exit 1; }
          unzip -l "$PLUGIN_ZIP" | grep -q "sutwx-app-api/sutwx-app-api.php" \
            || { echo "::error::插件包缺少入口文件"; exit 1; }

          ls -lh release-assets

      - name: 创建 Release 并附加交付物
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: release-notes.md
          files: release-assets/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}

  # OPS-006：体验版自动上传（可选）。未配置 MINIPROGRAM_PRIVATE_KEY 时自动跳过，
  # 不阻断 Release 创建。需在仓库 Secrets 配置小程序代码上传密钥与 IP 白名单。
  miniprogram-preview:
    name: 上传小程序体验版
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: release
    continue-on-error: true
    steps:
      - name: 检出目标 Tag 代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 安装依赖
        working-directory: SutWxApp
        run: npm ci

      - name: 上传体验版
        working-directory: SutWxApp
        env:
          MINIPROGRAM_PRIVATE_KEY: ${{ secrets.MINIPROGRAM_PRIVATE_KEY }}
        run: |
          if [ -z "$MINIPROGRAM_PRIVATE_KEY" ]; then
            echo "::notice::未配置 MINIPROGRAM_PRIVATE_KEY，跳过体验版上传"
            exit 0
          fi
          printf "%s" "$MINIPROGRAM_PRIVATE_KEY" > private.key
          npm run deploy:preview
