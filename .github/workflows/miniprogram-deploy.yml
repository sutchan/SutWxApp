# 文件路径: .github/workflows/miniprogram-deploy.yml
# 版本号: 1.2.0
# 更新日期: 2026-11-14
# 描述: 小程序持续部署流水线：手动触发，经 miniprogram-ci 生成预览二维码或上传体验版。
#       部署步骤复用 .github/actions/upload-miniprogram，与 release.yml 的自动上传同源。

name: Deploy MiniProgram

on:
  workflow_dispatch:
    inputs:
      action:
        description: "部署动作：preview（预览二维码）或 upload（上传体验版）"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - upload
      version:
        description: "上传版本号（留空则取 SutWxApp/package.json 的 version）"
        required: false
        default: ""
        type: string
      desc:
        description: "版本备注（留空则自动生成）"
        required: false
        default: ""
        type: string

# 部署仅需读取仓库内容与密钥，不写回仓库
permissions:
  contents: read

concurrency:
  group: deploy-miniprogram
  cancel-in-progress: false

jobs:
  deploy:
    name: 上传小程序代码包
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node 环境
        uses: ./.github/actions/setup-node

      # 手动触发时密钥缺失直接失败；密钥一律经 action inputs → env 传入，不插值进 shell
      - name: 生成预览二维码 / 上传体验版
        uses: ./.github/actions/upload-miniprogram
        with:
          action: ${{ inputs.action }}
          version: ${{ inputs.version }}
          desc: ${{ inputs.desc }}
          privateKey: ${{ secrets.MINIPROGRAM_PRIVATE_KEY }}
          appId: ${{ secrets.MINIPROGRAM_APPID }}

      - name: 归档预览二维码
        if: ${{ inputs.action == 'preview' }}
        uses: actions/upload-artifact@v7
        with:
          name: preview-qrcode
          path: SutWxApp/preview.jpg
          if-no-files-found: warn
          retention-days: 7

