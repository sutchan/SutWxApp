# 文件路径: .github/workflows/miniprogram-deploy.yml
# 版本号: 1.0.0
# 更新日期: 2026-09-12
# 描述: 小程序持续部署流水线：手动触发，经 miniprogram-ci 生成预览二维码或上传体验版

name: Deploy MiniProgram

on:
  workflow_dispatch:
    inputs:
      action:
        description: "部署动作：preview（预览二维码）或 upload（上传体验版）"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - upload
      version:
        description: "上传版本号（留空则取 SutWxApp/package.json 的 version）"
        required: false
        default: ""
        type: string
      desc:
        description: "版本备注（留空则自动生成）"
        required: false
        default: ""
        type: string

# 部署需要 GitHub Release / 密钥读取能力
permissions:
  contents: read

concurrency:
  group: deploy-miniprogram
  cancel-in-progress: false

defaults:
  run:
    working-directory: SutWxApp

jobs:
  deploy:
    name: 上传小程序代码包
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SutWxApp/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 校验部署密钥是否配置
        env:
          PRIVATE_KEY: ${{ secrets.MINIPROGRAM_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::缺少仓库 Secret「MINIPROGRAM_PRIVATE_KEY」。请在微信公众平台「开发管理 > 开发设置 > 小程序代码上传」生成密钥并写入仓库 Secrets。"
            exit 1
          fi
          if [ -z "${{ secrets.MINIPROGRAM_APPID }}" ] && grep -q '"appid": "touristappid"' project.config.json; then
            echo "::error::project.config.json 中 appid 仍为占位值 touristappid，请配置 Secret「MINIPROGRAM_APPID」或在 project.config.json 中填写真实 AppID。"
            exit 1
          fi

      - name: 写入上传私钥
        env:
          PRIVATE_KEY: ${{ secrets.MINIPROGRAM_PRIVATE_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/miniprogram-private.key"
          printf '%s' "$PRIVATE_KEY" > "$KEY_PATH"
          echo "MINIPROGRAM_PRIVATE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: 安装 miniprogram-ci
        run: npm install --no-save miniprogram-ci@^2

      - name: 生成预览二维码 / 上传体验版
        env:
          MINIPROGRAM_APPID: ${{ secrets.MINIPROGRAM_APPID }}
          DEPLOY_ACTION: ${{ inputs.action }}
          DEPLOY_VERSION: ${{ inputs.version }}
          DEPLOY_DESC: ${{ inputs.desc }}
        run: node scripts/deploy.js

      - name: 归档预览二维码
        if: ${{ inputs.action == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-qrcode
          path: SutWxApp/preview.jpg
          if-no-files-found: warn
          retention-days: 7

      - name: 清理私钥
        if: always()
        run: rm -f "$MINIPROGRAM_PRIVATE_KEY_PATH"
