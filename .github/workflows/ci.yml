# 文件路径: .github/workflows/ci.yml
# 版本号: 1.2.0
# 更新日期: 2026-11-14
# 描述: 持续集成流水线：ESLint 代码检查、Jest 单元测试、八项一致性门禁、
#       静态站点（原型展示站）构建冒烟、WordPress 插件（PHP）语法检查与单测

name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# 最小权限：CI 只读仓库内容
permissions:
  contents: read

# 同一分支的重复推送取消上一次未完成的运行，节省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 小程序工程位于 SutWxApp/ 子目录，所有命令默认在该目录执行
defaults:
  run:
    working-directory: SutWxApp

jobs:
  # ---------- 1. 代码静态检查 ----------
  lint:
    name: ESLint 代码检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SutWxApp/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行 ESLint
        run: npm run lint

  # ---------- 2. 单元测试 ----------
  test:
    name: Jest 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SutWxApp/package-lock.json

      - name: 安装依赖
        run: npm ci

      # 防线一：用例必须纳入版本控制；防线二：test:coverage 已移除 --passWithNoTests，
      # 0 用例时 Jest 直接失败。两者共同杜绝「CI 假绿」。
      - name: 检查用例是否纳入版本控制
        working-directory: .
        run: |
          COUNT=$(git ls-files '*.test.js' | grep -cE '^(tests/|SutWxApp/__tests__/)' || true)
          echo "受版本控制的 Jest 用例文件：$COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::未发现受版本控制的 Jest 用例，禁止 0 用例空跑"
            exit 1
          fi

      - name: 运行单元测试（含覆盖率）
        run: npm run test:coverage

      - name: 归档覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: SutWxApp/coverage/
          if-no-files-found: ignore
          retention-days: 7

  # ---------- 3. 八项一致性门禁 ----------
  checks:
    name: 八项一致性门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # 与本地 `npm run ci` 同源：check-version / check-config / check-images /
      # check-ids / check-contract / check-bundle / check-plugin-version / check-docs
      # 均为纯 Node 内置模块脚本，无需安装依赖；新增门禁自动纳入 CI，避免只跑部分脚本造成漂移。
      - name: 运行八项一致性门禁
        run: npm run check

  # ---------- 4. 静态站点（原型展示站）构建与冒烟 ----------
  site:
    name: 静态站点构建与冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 覆盖文件级 defaults：站点工程位于仓库根
    defaults:
      run:
        working-directory: .
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # build.js 仅依赖 Node 内置模块，构建阶段零依赖
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 构建站点产物
        run: node build.js

      - name: 校验产物完整性
        run: |
          node -e '
          const fs = require("fs");
          const required = [
            "index.html",
            "dist/index.html",
            "dist/prototype.html",
            "dist/prototype-extra.html",
            "dist/wireframes.html",
            "dist/docs/PROJECT_OVERVIEW.md"
          ];
          const missing = required.filter((f) => !fs.existsSync(f));
          if (missing.length) {
            console.error("缺少产物：" + missing.join("，"));
            process.exit(1);
          }
          const html = fs.readFileSync("dist/index.html", "utf8");
          if (!html.includes("<title>") || !html.includes("og:title")) {
            console.error("dist/index.html 缺少 title / og 元信息，build.js 注入可能失败");
            process.exit(1);
          }
          console.log("产物校验通过：" + required.length + " 个文件");
          '

      - name: 安装运行时依赖（供冒烟服务使用）
        run: npm install --omit=dev --no-audit --no-fund

      - name: 启动服务并冒烟验证
        run: |
          node server.js &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          for path in / /prototype.html /prototype-extra.html /wireframes.html /docs/PROJECT_OVERVIEW.md; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000${path}")
            echo "${path} -> ${code}"
            if [ "$code" != "200" ]; then
              echo "::error::路由 ${path} 返回 ${code}"
              exit 1
            fi
          done

      - name: 归档站点产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist/
          if-no-files-found: warn
          retention-days: 7

  # ---------- 5. WordPress 插件（PHP）语法检查与单测 ----------
  php:
    name: PHP 插件语法检查与单测
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl
          coverage: none

      - name: 语法检查（php -l）
        run: |
          set -o pipefail
          find sutwx-app-api -name '*.php' -print0 \
            | xargs -0 -n1 -P 4 php -l | tee php-lint.log
          if grep -q 'Errors parsing' php-lint.log; then
            echo "::error::PHP 语法检查未通过"
            exit 1
          fi
          echo "PHP 语法检查通过"

      # 八个脚本自带 WP/WC 桩，可脱离 WordPress 独立运行，退出码 0=通过 / 1=失败
      - name: 运行映射层单测
        run: php sutwx-app-api/tests/run-mapping-tests.php

      - name: 运行主题配置单测
        run: php sutwx-app-api/tests/run-settings-tests.php

      - name: 运行鉴权单测
        run: php sutwx-app-api/tests/run-auth-tests.php

      - name: 运行缓存与限频单测
        run: php sutwx-app-api/tests/run-cache-tests.php

      - name: 运行订单映射单测
        run: php sutwx-app-api/tests/run-order-tests.php

      - name: 运行微信支付 V3 单测
        run: php sutwx-app-api/tests/run-pay-tests.php

      - name: 运行平台能力单测
        run: php sutwx-app-api/tests/run-platform-tests.php

      - name: 运行支付异常路径单测
        run: php sutwx-app-api/tests/run-pay-exception-tests.php
