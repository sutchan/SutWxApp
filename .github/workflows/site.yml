# 文件路径: .github/workflows/site.yml
# 版本号: 1.1.0
# 更新日期: 2026-11-14
# 描述: 静态站点（原型展示站）持续部署：构建 dist/ 并发布到 GitHub Pages
#       仓库需在 Settings → Pages 将 Source 设为「GitHub Actions」

name: Deploy Site

on:
  push:
    branches:
      - main
    # build.js 的输入源：prototype/、docs/、小程序图片资源与构建脚本；
    # 根 index.html / prototype-extra.html / wireframes.html 为生成产物，不作为触发源。
    paths:
      - "prototype/**"
      - "docs/**"
      - "SutWxApp/images/**"
      - "build.js"
      - "server.js"
      - "package.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 部署串行执行，避免并发发布互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建站点产物
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 构建零依赖（纯 Node 内置模块），故不启用依赖缓存
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 构建站点产物
        run: node build.js

      - name: 校验产物完整性
        run: |
          node -e '
          const fs = require("fs");
          const required = [
            "dist/index.html",
            "dist/prototype.html",
            "dist/prototype-extra.html",
            "dist/wireframes.html",
            "dist/docs/PROJECT_OVERVIEW.md"
          ];
          const missing = required.filter((f) => !fs.existsSync(f));
          if (missing.length) {
            console.error("缺少产物：" + missing.join("，"));
            process.exit(1);
          }
          console.log("产物校验通过：" + required.length + " 个文件");
          '

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
