# 文件路径: .github/workflows/site.yml
# 版本号: 1.2.0
# 更新日期: 2026-11-14
# 描述: 静态站点（原型展示站）持续部署：构建 dist/ 并发布到 GitHub Pages。
#       构建与产物校验复用 .github/actions/build-site，与 ci.yml 口径一致。
#       仓库需在 Settings → Pages 将 Source 设为「GitHub Actions」

name: Deploy Site

on:
  push:
    branches:
      - main
    # build.js 的输入源：prototype/、docs/、小程序图片资源与构建脚本；
    # 根 index.html / prototype-extra.html / wireframes.html 为生成产物，不作为触发源。
    paths:
      - "prototype/**"
      - "docs/**"
      - "SutWxApp/images/**"
      - "build.js"
      - "server.js"
      - "package.json"
      - "scripts/check-site-dist.js"
      - ".github/actions/build-site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 部署串行执行，避免并发发布互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建站点产物
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 构建零依赖（纯 Node 内置模块），故不启用依赖缓存
      - name: 准备 Node 环境
        uses: ./.github/actions/setup-node
        with:
          install: "false"

      - name: 构建并校验站点产物
        uses: ./.github/actions/build-site

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
