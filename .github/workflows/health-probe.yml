# 文件名: health-probe.yml
# 描述: 生产环境外部拨测（OPS-005）——每 5 分钟探测 /api/health，连续失败即推送告警。
#
# 需要的仓库配置（Settings → Secrets and variables → Actions）：
#   vars.PROBE_URL       生产健康检查地址，如 https://api.example.com/api/health
#   secrets.WECOM_WEBHOOK 企业微信机器人 Webhook（可选，未配置则仅在 Actions 失败可见）
#
# 说明：GitHub Actions 的 cron 最小间隔为 5 分钟，且高峰时段可能延迟数分钟，
#       仅用于兜底发现；生产告警以服务端 error_log 转告警通道为主。

name: Health Probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-probe
  cancel-in-progress: false

jobs:
  probe:
    name: 拨测 /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 探测健康端点
        id: probe
        env:
          PROBE_URL: ${{ vars.PROBE_URL }}
        run: |
          if [ -z "$PROBE_URL" ]; then
            echo "::warning::未配置 vars.PROBE_URL，跳过拨测"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY_FILE=$(mktemp)
          CODE=$(curl -sS -m 15 -o "$BODY_FILE" -w '%{http_code}' "$PROBE_URL" || echo 000)
          BODY=$(cat "$BODY_FILE")
          echo "http_status=$CODE" >> "$GITHUB_OUTPUT"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
          echo "HTTP $CODE"
          echo "$BODY"

          if [ "$CODE" != "200" ]; then
            echo "::error::健康检查返回 $CODE"
            exit 1
          fi

          # 端点应返回 JSON 且 wcActive=true；payConfigured 为 false 仅告警不失败。
          echo "$BODY" | grep -q '"wcActive":true' || { echo "::error::wcActive 不为 true"; exit 1; }
          echo "$BODY" | grep -q '"payConfigured":true' || echo "::warning::payConfigured 为 false（支付凭证未配置）"

      - name: 推送企业微信告警
        if: failure()
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          PROBE_URL: ${{ vars.PROBE_URL }}
        run: |
          if [ -z "$WECOM_WEBHOOK" ]; then
            echo "::warning::未配置 secrets.WECOM_WEBHOOK，跳过告警推送"
            exit 0
          fi
          CONTENT="[告警] 健康检查失败\\n地址：${PROBE_URL:-未配置}\\n时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')\\n详情：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -m 10 -H 'Content-Type: application/json' \
            -d "{\\"msgtype\\":\\"text\\",\"text\\":{\\"content\\":\\"$CONTENT\\"}}" \
            "$WECOM_WEBHOOK" > /dev/null && echo "告警已推送"
